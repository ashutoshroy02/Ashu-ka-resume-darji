# Project library for the resume tailor.
# Each entry is one project that can be dropped into any base template's Projects section.
#   id     : stable key (used by the Telegram picker and the AI ranker)
#   name   : short label shown on the Telegram button
#   tags   : what the project shows off; the AI ranker matches these against the JD
#   match  : substrings that identify this project inside a template's \resumeProjectHeading
#            (if a base template already has its own wording of the project, that wording is used)
#   latex  : the block used when the base template does NOT already contain the project
#   hide_if: optional; if any of these strings appears outside the base's Projects section
#            (e.g. the same work listed under Experience), the project isn't offered
# To add a project: append an entry. No code changes needed.

projects:
